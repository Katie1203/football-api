<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07130f"><title>Đăng nhập · THẦN TÀI MAY MẮN</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse 70% 60% at 50% 50%,#10231b 0%,#07140f 55%,#040b09 100%);color:#f5f0e4;display:grid;place-items:center;padding:24px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;background:linear-gradient(155deg,transparent 0 72%,rgba(178,126,37,.07) 74%,transparent 77%),linear-gradient(24deg,transparent 0 80%,rgba(178,126,37,.07) 82%,transparent 84%)}
.card{position:relative;width:min(100%,440px);padding:38px 35px 32px;background:linear-gradient(155deg,#0d1b15,#07100d);border:1px solid #ad873f;border-radius:17px;box-shadow:0 22px 75px #0008,0 0 28px #bd923019}
.brand{text-align:center;margin-bottom:32px}.star{font-size:28px;color:#f2c56a;line-height:1;margin-bottom:13px}.brand h1{font-size:clamp(23px,5vw,30px);margin:0;color:#f1c774;letter-spacing:.6px;font-weight:800}.brand p{margin:12px 0 0;font-size:10px;letter-spacing:1.8px;color:#acb5ac;line-height:1.6}
label{display:block;margin:0 0 8px;font-size:12px;color:#d8c393} .field{position:relative;margin-bottom:20px}.field input{width:100%;height:52px;padding:0 48px 0 16px;background:#07120f;border:1px solid #8e6c32;border-radius:9px;color:#f5efde;font:inherit;font-size:15px;outline:none}.field input:focus{border-color:#f3c76e;box-shadow:0 0 0 3px #f3c76e22}.field input::placeholder{color:#77877e}
.eye{position:absolute;right:9px;bottom:7px;width:39px;height:39px;background:none;border:0;color:#d9b566;cursor:pointer;font-size:18px}.submit{width:100%;height:53px;border:1px solid #f3cb76;border-radius:10px;background:linear-gradient(105deg,#b77f2f,#f2ca74 48%,#c58d3a);color:#15120a;font-size:15px;font-weight:800;cursor:pointer;transition:filter .15s}.submit:hover{filter:brightness(1.09)}.submit:disabled{opacity:.6;cursor:wait}
.error{color:#ffb2a5;font-size:13px;min-height:20px;margin:0 0 12px;text-align:center}.note{text-align:center;color:#75877b;font-size:11px;margin-top:20px}
@media(max-width:480px){.card{padding:30px 22px 25px}.brand{margin-bottom:27px}}
</style>
<style id="tt-unified-gold-form">

.tt-unified{margin:0!important;padding:0 16px 24px!important;background:radial-gradient(ellipse 100% 35% at 50% 0%,#25200f 0%,#09140f 45%,#050d0b 100%) fixed!important}
.tt-unified main{margin:18px auto!important}
.tt-global-header{max-width:1600px;margin:0 auto;min-height:62px;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(115deg,#17180e,#08120f 45%,#211b0d);border:1px solid #d5a646;border-top:0;border-radius:0 0 15px 15px;box-shadow:0 4px 18px #bf8b2728,0 1px 0 #ffe39a50;position:relative;z-index:3}
.tt-global-brand{font-size:clamp(16px,1.6vw,22px)!important;line-height:1.15;font-weight:900;color:#f8cf79!important;white-space:normal;max-width:255px;min-width:160px;text-decoration:none;letter-spacing:.1px;text-shadow:0 0 10px #c68b3a40}
.tt-global-links{display:flex;flex:1;align-items:center;gap:3px;flex-wrap:wrap;background:none!important;border:0!important;padding:0!important;margin:0!important}
.tt-global-links a{font-size:12px!important;white-space:nowrap;color:#e8e6dd!important;text-decoration:none;padding:10px 9px;border:1px solid transparent!important;border-radius:8px}
.tt-global-links a:hover{border-color:#a98439!important;background:#30250f!important}
.tt-global-links a.tt-current{color:#1d160a!important;background:linear-gradient(120deg,#edb642,#ffdc80,#c88b23)!important;border:1px solid #e7b74f!important;box-shadow:0 0 13px #d69e3b55;font-weight:800}
.tt-global-running{font-size:11px;color:#a4dc91;white-space:nowrap}
.tt-global-refresh{padding:6px 12px!important;font-size:20px!important;color:#ffd77a!important;background:#0a1510!important;border:1px solid #bd913d!important;border-radius:9px!important;cursor:pointer}
.tt-unified .stat,.tt-unified .panel,.tt-unified .card,.tt-unified .metric{background-color:#0b1814!important;border-color:#a78031!important;box-shadow:inset 0 1px 0 #ffde7712}
.tt-unified h1,.tt-unified h2,.tt-unified h3{color:#f1d18d}
.tt-unified button:not(.tt-global-refresh),.tt-unified select,.tt-unified input{border-color:#a78031}
.tt-unified button.active,.tt-unified button[aria-selected="true"]{background:#efbf58!important;color:#171208!important;border-color:#f4d077!important}
.tt-unified .muted,.tt-unified .hint,.tt-unified .sub{color:#b5bfb2}
.tt-unified a{color:#edcb7c}
.tt-unified .stat strong{color:#f3ce7e}
.tt-unified table{border-color:#a78031}
.tt-unified th{background:#18251c;color:#f1d18d}
.tt-unified .summary-cell.sent{background:#574018!important;border-color:#e5b84e!important}
.tt-unified .summary-cell.sent strong{color:#ffdc77!important}
@media(max-width:980px){.tt-global-header{flex-wrap:wrap}.tt-global-brand{flex:1}.tt-global-links{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}.tt-global-links a{flex-shrink:0}.tt-unified{padding:0 10px 20px!important}}
@media(max-width:540px){.tt-global-header{padding:10px}.tt-global-brand{font-size:18px!important}.tt-global-links a{font-size:11px!important;padding:9px 8px}}
</style>

<style id="tt-login-form-consistency">
body{background:radial-gradient(ellipse 70% 60% at 50% 50%,#142019 0%,#07140f 55%,#040b09 100%)!important}
.card{border-color:#d5a646!important;box-shadow:0 20px 65px #0009,0 0 22px #c4943025!important}

<style id="tt-final-shared-visual">
/* TTMM design system — colors, typography and controls ONLY. Layout/grid untouched. */
:root{
  color-scheme:dark;
  --tt-bg:#070f0d;--tt-card:#0c1714;--tt-card-2:#111b17;
  --tt-gold:#f4c968;--tt-gold-light:#ffe0a0;--tt-border:#c39a45;
  --tt-white:#f7f2e7;--tt-muted:#b9bfb4;
  --tt-selected:linear-gradient(120deg,#dba438 0%,#ffdb7b 54%,#d5a037 100%);
}
body{background-color:var(--tt-bg)!important;color:var(--tt-white)!important;
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif!important}
h1,h2,h3{color:var(--tt-gold-light)!important;letter-spacing:.1px}
small,.muted,.hint,.sub,.note{color:var(--tt-muted)}
a{color:var(--tt-gold)!important}
button,input,select,textarea{font-family:inherit!important}
button,select,input,textarea{
  border:1px solid #a9843b!important;border-radius:8px!important;
  background-color:#111c17;color:var(--tt-white);
}
button{cursor:pointer;font-weight:650;transition:background-color .16s,border-color .16s,box-shadow .16s}
button:hover:not(:disabled){border-color:var(--tt-gold-light)!important;background-color:#342916!important}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
 outline:2px solid var(--tt-gold-light)!important;outline-offset:2px
}
button.active,button.selected,button[aria-selected="true"],.tabs button.active,
#model-menu button.active,#tabs button.active,.tt-global-links a.tt-current{
 background:var(--tt-selected)!important;color:#1d160a!important;
 border-color:#ffda76!important;box-shadow:0 0 11px #dba43b3b!important;
}
.stat,.panel,.ai-metric,.ai-detail-card,.metric,.match-card,.card,.summary-cell{
 background-color:var(--tt-card)!important;border-color:var(--tt-border)!important;
 box-shadow:inset 0 1px 0 #ffe6a00a;
}
.stat strong,.stat b,.ai-metric strong,.metric strong{color:var(--tt-gold)!important}
.stat small,.metric small,.ai-detail-card small{color:var(--tt-muted)!important}
th{color:var(--tt-gold-light)!important;background-color:#18231b!important}
td{color:var(--tt-white)}
tr:hover{background-color:#272416!important}
.match-card .teams,.match-card .team,.teams,.score{color:var(--tt-white)}
.match-card .score,.score strong{color:var(--tt-gold-light)}
/* Preserve meaningful alert and result state colors. */
.win{color:#7ce3aa!important}.loss,.bad{color:#ff929c!important}
.pending{color:#ffd37c!important}
.minute{color:#fff!important}
.summary-cell.sent{background:#574018!important;border-color:#e5b84e!important}
.summary-cell.sent small{color:#ffe39a!important}
.summary-cell.sent strong{color:#ffdc77!important}
.tt-global-header,.promax-topbar{border-color:#d5a646!important;
 background:linear-gradient(115deg,#191a11,#08120f 45%,#241c0d)!important;
 box-shadow:0 3px 16px #d69e3b2b!important}
.tt-global-brand,.promax-brand{color:#f8cf79!important;font-weight:850!important}
.tt-global-links a,.promax-nav a{color:#f3eee3!important;font-weight:600!important}
.tt-global-links a.tt-current,.promax-nav a.nav-current{
 background:var(--tt-selected)!important;color:#1d160a!important;
 border-color:#f5ca6a!important;box-shadow:0 0 12px #dfae5050!important}
.tt-global-refresh,.promax-refresh{color:#ffdc83!important;border-color:#d1a34e!important}
@media(max-width:650px){button{min-height:36px}h1{line-height:1.25}}
</style></head><body><main class="card">
<div class="brand"><div class="star">✦</div><h1>THẦN TÀI MAY MẮN</h1><p>HỆ THỐNG DỰ ĐOÁN BÀN THẮNG BÓNG ĐÁ LIVE</p></div>
<form id="form" autocomplete="on"><label for="username">Tên đăng nhập</label><div class="field"><input id="username" name="username" autocomplete="username" placeholder="Tên đăng nhập" required maxlength="128"></div>
<label for="password">Mật khẩu</label><div class="field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required><button type="button" class="eye" id="eye" aria-label="Hiện mật khẩu">◉</button></div>
<p class="error" id="error" role="alert"></p><button class="submit" id="submit" type="submit">ĐĂNG NHẬP →</button></form>
<div class="note">THẦN TÀI MAY MẮN · LIVE MONITOR</div></main>
<script>
const form=document.getElementById('form'),pass=document.getElementById('password'),eye=document.getElementById('eye'),error=document.getElementById('error'),submit=document.getElementById('submit');
eye.addEventListener('click',()=>{pass.type=pass.type==='password'?'text':'password';eye.setAttribute('aria-label',pass.type==='password'?'Hiện mật khẩu':'Ẩn mật khẩu')});
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;try{
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:pass.value})});
const d=await r.json().catch(()=>null);
if(!r.ok||!d?.ok){
 if(r.status===404)throw Error('Máy chủ chưa có API /api/login (HTTP 404). Kiểm tra đã triển khai đúng bản ZIP mới lên Render.');
 throw Error(d?.error||'Đăng nhập không thành công (HTTP '+r.status+').');
}
// A successful password check alone does not prove Safari saved the session cookie.
const session=await fetch('/api/login/session',{credentials:'same-origin',cache:'no-store'});
const verified=await session.json().catch(()=>null);
if(!session.ok||!verified?.ok)throw Error('Mật khẩu đúng nhưng Safari chưa lưu phiên đăng nhập (HTTP '+session.status+'). Kiểm tra cookie và bản triển khai Render.');
const next=new URLSearchParams(location.search).get('next');location.assign(next&&next.startsWith('/')&&!next.startsWith('//')?next:'/dashboard');
}catch(e){error.textContent=e.message}finally{submit.disabled=false}});
</script></body></html>
