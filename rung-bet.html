const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){try{const r=await fetch('/api/rung-bet',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const matches=Array.isArray(d.records)?d.records:[];document.getElementById('sentCount').textContent=matches.length;document.getElementById('liveCount').textContent=matches.length;document.getElementById('updateTime').textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('status').textContent='Đang theo dõi '+matches.length+' trận · '+new Date().toLocaleTimeString('vi-VN');document.getElementById('grid').innerHTML=matches.map(x=>`<article class="card"><div class="top"><span class="league">${esc(x.league)}</span><span class="minute">${esc(x.minute)}′</span></div><div class="teams">${esc(x.home)}<div class="score">${esc(x.score)}</div><div class="sent-score">Lúc gửi: ${esc(x.scoreAtAlert||x.score)} · LIVE: ${esc(x.score)}</div>${esc(x.away)}</div><div class="bottom"><span>CÒN BÀN THẮNG</span><span class="rung tt-alert-pulse ${esc(x.alertLabel||'RUNG BET')==='BIGGG BET'?'tt-biggg':''}">${esc(x.alertLabel||'RUNG BET')}</span></div></article>`).join('')||'<div class="empty">Hiện chưa có trận đã gửi cảnh báo đang LIVE.</div>';}catch(e){document.getElementById('status').textContent='Không tải được dữ liệu: '+e.message;}}load();setInterval(load,20000);
</script><script>/* Shared VN clock; presentation only */(function(){function tick(){document.querySelectorAll('.tt-global-clock').forEach(e=>e.textContent=new Date().toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour12:false,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}));}tick();setInterval(tick,1000)})();</script></body></html>
