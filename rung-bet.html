<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THẦN TÀI MAY MẮN · RUNG BET</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#070d0d;color:#f0d899}main{max-width:1520px;margin:auto;padding:14px}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px;border:1px solid #7e621f;border-radius:12px;background:linear-gradient(120deg,#171a13,#0a1413)}nav b{font-size:clamp(16px,2vw,23px);color:#e9c777;letter-spacing:.2px;margin-right:auto}a{color:#e9c777;text-decoration:none;font-size:13px}h1{font-size:20px;margin:22px 0 6px}.sub{font-size:13px;color:#a6a99b}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.card{min-width:0;background:linear-gradient(145deg,#121b19,#090f0e);border:1px solid #b99752;border-radius:12px;padding:13px;box-shadow:0 5px 15px #0006}.top{display:flex;justify-content:space-between;align-items:center;gap:7px}.league{color:#e9c777;font-size:11px;overflow-wrap:anywhere}.minute{background:#a22637;border-radius:5px;padding:4px 7px;font-weight:800;font-size:12px}.teams{margin:14px 0;text-align:center;font-weight:750;font-size:15px;overflow-wrap:anywhere;min-height:56px}.score{text-align:center;color:#e9c777;font-size:30px;font-weight:900;margin:8px 0}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}.bottom span{text-align:center;font-size:11px;font-weight:800;border-radius:6px;padding:9px 4px;background:#173e2f;color:#e9c777}.bottom .rung{background:#6e292a;color:#f0d899;animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{background:#a23a37;box-shadow:0 0 9px #a23a3744}}.empty{grid-column:1/-1;color:#bbb6a5;text-align:center;padding:45px 8px;border:1px dashed #65572d;border-radius:12px}#status{color:#b9b49f;font-size:12px;margin:9px 0}@media(max-width:1120px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{padding:9px}.grid{grid-template-columns:1fr}.teams{min-height:0}.card{padding:12px}nav{padding:11px}}@media(prefers-reduced-motion:reduce){.bottom .rung{animation:none}}
/* Approved compact three-cell strip; only alerts highlighted. */
.summary-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 10px}
.summary-cell{min-width:0;background:#101916;border:1px solid #4d4b3a;border-radius:11px;padding:13px 15px}
.summary-cell small{display:block;font-size:11px;color:#a6b2aa;margin-bottom:7px}
.summary-cell strong{font-size:27px;color:#e5e9e5}
.summary-cell.sent{background:#574018;border-color:#e9c777}
.summary-cell.sent small{color:#f0d899;font-weight:800}
.summary-cell.sent strong{color:#e9c777}
@media(max-width:600px){.summary-strip{gap:5px}.summary-cell{padding:9px 7px}.summary-cell small{font-size:9px}.summary-cell strong{font-size:21px}}

/* Unified THẦN TÀI MAY MẮN palette — presentation only; preserve DOM and JS. */
:root{color-scheme:dark;--tt-bg:#080e0e;--tt-surface:#111917;--tt-surface2:#17201b;--tt-gold:#e9c777;--tt-gold-bright:#f5d78f;--tt-border:#876c36;--tt-text:#f2eddd;--tt-muted:#aab3a9}
body{background-color:var(--tt-bg)!important;color:var(--tt-text)!important}
h1,h2,h3{color:var(--tt-text)}
a{color:var(--tt-gold)!important}
.stat,.panel,.card,.match-card{background-color:var(--tt-surface)!important;border-color:var(--tt-border)!important}
.stat strong,.stat b{color:var(--tt-gold)!important}
button,input,select{border-color:var(--tt-border)!important}
button{background-color:#1c211b;color:var(--tt-gold-bright)}
button.active,button[aria-selected="true"],.nav a.active{background-color:#e5b84e!important;color:#16150f!important;border-color:#e5b84e!important}
nav a,.nav a{border-color:var(--tt-border)!important}
.muted,.hint,.note,small{color:var(--tt-muted)}
</style></head><body><main><nav><b>✦ THẦN TÀI MAY MẮN</b><a href="/dashboard">Dashboard</a><a href="/live-monitor">Theo dõi LIVE</a><a href="/scan-history">Lịch sử quét</a></nav><h1>Trận đã gửi cảnh báo · Đang LIVE</h1><p class="sub">Chỉ hiển thị trận đã gửi Telegram và chưa xác nhận FT. Tự cập nhật mỗi 20 giây.</p><div class="summary-strip" aria-label="Thống kê cảnh báo LIVE"><div class="summary-cell sent"><small>♧ ĐÃ GỬI CẢNH BÁO</small><strong id="sentCount">—</strong></div><div class="summary-cell"><small>TRẬN ĐANG LIVE</small><strong id="liveCount">—</strong></div><div class="summary-cell"><small>CẬP NHẬT</small><strong id="updateTime">—</strong></div></div><div id="status">Đang tải…</div><div id="grid" class="grid"></div></main><script>
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){try{const r=await fetch('/api/rung-bet',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const matches=Array.isArray(d.records)?d.records:[];document.getElementById('sentCount').textContent=matches.length;document.getElementById('liveCount').textContent=matches.length;document.getElementById('updateTime').textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('status').textContent='Đang theo dõi '+matches.length+' trận · '+new Date().toLocaleTimeString('vi-VN');document.getElementById('grid').innerHTML=matches.map(x=>`<article class="card"><div class="top"><span class="league">${esc(x.league)}</span><span class="minute">${esc(x.minute)}′</span></div><div class="teams">${esc(x.home)}<div class="score">${esc(x.score)}</div>${esc(x.away)}</div><div class="bottom"><span>CÒN BÀN THẮNG</span><span class="rung">RUNG BET</span></div></article>`).join('')||'<div class="empty">Hiện chưa có trận đã gửi cảnh báo đang LIVE.</div>';}catch(e){document.getElementById('status').textContent='Không tải được dữ liệu: '+e.message;}}load();setInterval(load,20000);
</script></body></html>
